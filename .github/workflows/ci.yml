name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  widget:
    name: Widget (typecheck, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  browser:
    name: Browser (built widget in Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:browser

  proxy:
    name: Proxy (${{ matrix.port }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        port: [node, python, php]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: matrix.port == 'python'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: proxy/python/requirements.txt
      - if: matrix.port == 'python'
        run: pip install -r proxy/python/requirements.txt
      - if: matrix.port == 'php'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl
          coverage: none
      # The embedding check downloads bge-small (34 MB) from Hugging Face; keep it between runs.
      - uses: actions/cache@v4
        with:
          path: |
            node_modules/@huggingface/transformers/.cache
            ~/.cache/deskpal
          key: embed-models-bge-small-v1
      - run: node proxy/test/conformance.mjs ${{ matrix.port }} --embed
